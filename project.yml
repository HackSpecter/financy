name: MoiFinansy
options:
  bundleIdPrefix: tj.khalid
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ru
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  MoiFinansy:
    type: application
    platform: iOS
    sources:
      - path: MoiFinansy
    info:
      path: MoiFinansy/Info.plist
      properties:
        AppDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: tj.khalid.hisob
            CFBundleURLSchemes: [hisob]
        UIAppFonts: [AmiriQuran-Regular.ttf, CormorantGaramond-VF.ttf, Lora-VF.ttf, NotoNaskhArabic-VF.ttf, PTSerif-Bold.ttf, PTSerif-Regular.ttf, PlayfairDisplay-VF.ttf, ScheherazadeNew-Bold.ttf, ScheherazadeNew-Regular.ttf]
    entitlements:
      path: MoiFinansy/MoiFinansy.entitlements
      properties:
        com.apple.security.application-groups: [group.tj.khalid.hisob]
        com.apple.developer.icloud-container-identifiers: [iCloud.tj.khalid.hisob]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.khalid.hisob
        PRODUCT_NAME: MoiFinansy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID защищает ваши финансовые данные."
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы сканировать чеки."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MoiFinansyWidgets
      - target: HisobShare
      - target: HisobWatch
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
  MoiFinansyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: MoiFinansy/Models
      - path: MoiFinansy/Services
      - path: MoiFinansy/Intents
      - path: MoiFinansy/Components/Color+Hex.swift
      - path: MoiFinansy/Components/StatusColor.swift
      - path: MoiFinansy/Components/AllowanceLockView.swift
      - path: MoiFinansy/Quran
      - path: MoiFinansy/Resources/Fonts
    entitlements:
      path: Widgets/MoiFinansyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.tj.khalid.hisob]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        AppDisplayName: "$(APP_DISPLAY_NAME)"
        UIAppFonts: [AmiriQuran-Regular.ttf, CormorantGaramond-VF.ttf, Lora-VF.ttf, NotoNaskhArabic-VF.ttf, PTSerif-Bold.ttf, PTSerif-Regular.ttf, PlayfairDisplay-VF.ttf, ScheherazadeNew-Bold.ttf, ScheherazadeNew-Regular.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.khalid.hisob.widgets
        PRODUCT_NAME: MoiFinansyWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION APP_EXTENSION"
  HisobShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: MoiFinansy/Models
      - path: MoiFinansy/Services
      - path: MoiFinansy/Components
        excludes: [AllowanceLockView.swift]
      - path: MoiFinansy/Features/SMS/HighlightedSMSText.swift
    entitlements:
      path: ShareExtension/HisobShare.entitlements
      properties:
        com.apple.security.application-groups: [group.tj.khalid.hisob]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Добавить в $(APP_DISPLAY_NAME)"
        AppDisplayName: "$(APP_DISPLAY_NAME)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.khalid.hisob.share
        PRODUCT_NAME: HisobShare
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_EXTENSION"
  HisobWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/App
      - path: MoiFinansy/Services/WatchSnapshot.swift
      - path: MoiFinansy/Components/Color+Hex.swift
    entitlements:
      path: Watch/HisobWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.tj.khalid.hisob]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.khalid.hisob.watchkitapp
        PRODUCT_NAME: HisobWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: tj.khalid.hisob
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: HisobWatchComplication
  HisobWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/Complication
      - path: Watch/App/WatchFormat.swift
      - path: MoiFinansy/Services/WatchSnapshot.swift
    entitlements:
      path: Watch/HisobWatchComplication.entitlements
      properties:
        com.apple.security.application-groups: [group.tj.khalid.hisob]
    info:
      path: Watch/Complication/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.khalid.hisob.watchkitapp.widget
        PRODUCT_NAME: HisobWatchComplication
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  MoiFinansyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoiFinansyTests
    dependencies:
      - target: MoiFinansy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.khalid.hisob.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MoiFinansy.app/MoiFinansy"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MoiFinansy:
    build:
      targets:
        MoiFinansy: all
        MoiFinansyTests: [test]
    test:
      targets: [MoiFinansyTests]
    run:
      config: Debug
