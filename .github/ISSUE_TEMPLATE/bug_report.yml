name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version and iPhone model
  - type: markdown
    attributes:
      value: "Do not paste real SMS, card numbers or balances. Replace them with made-up values."
